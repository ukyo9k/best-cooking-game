<!DOCTYPE html>
<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ember &amp; Ladle — a rush-hour cooking game</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<main class="stage">
  <canvas id="game" width="1280" height="720" aria-label="Ember and Ladle cooking game"></canvas>
